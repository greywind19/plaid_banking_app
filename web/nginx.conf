server {
    listen 80;
    server_name _;

    # Serve the built React static files.
    root /usr/share/nginx/html;
    index index.html;

    # ---- LOCAL/COMPOSE ONLY: reverse-proxy the API ----------------------
    # The React app calls fetch("/api/..."). Here nginx forwards those to the
    # server container ("server" = the docker-compose service name, port 8787).
    #
    # >>> For Azure Container Apps: DELETE this whole `location /api` block. <<<
    # ACA gives the server its own ingress URL; the UI calls that URL directly
    # (baked in at build time) and ACA's ingress does the routing. Nothing else
    # in this file changes.
    location /api/ {
        proxy_pass         http://server:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    # ---------------------------------------------------------------------

    # SPA fallback: any non-file route returns index.html so client-side
    # routing works (React handles the path in the browser).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
